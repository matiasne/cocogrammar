services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: teacher
      POSTGRES_PASSWORD: teacher
      POSTGRES_DB: english_teacher
    ports:
      # Host 5433 → container 5432, to avoid clashing with a local Postgres on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teacher -d english_teacher"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
